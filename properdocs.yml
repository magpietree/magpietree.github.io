site_name: non-specific bird
site_url: https://magpietree.github.io/
theme:
  name: material
  palette:
    scheme: slate
    primary: teal
  icon: 
    logo: material/bird
nav: 
  - Home: "index.md"
  - Haves: "have.md"
  - Wants: "wants.md"
plugins:
  - macros
  - table-reader:
      data_path: "docs/tables/"
      allow_missing_files: True
  - search
  - git-revision-date-localized
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - mdx_linkify
extra_css:
  - css/github-tables.css
  - css/extra.css
extra_javascript:
  - https://unpkg.com/tablesort@5.3.0/dist/tablesort.min.js
  - javascripts/tablesort.js
